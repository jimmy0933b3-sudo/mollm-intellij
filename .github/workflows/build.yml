name: Build and Release Plugin

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install CJK fonts for Swing UI tests
        timeout-minutes: 3
        shell: bash
        run: |
          set -Eeuo pipefail
          font_dir="$HOME/.local/share/fonts"
          mkdir -p "$font_dir"
          font="$font_dir/NotoSansCJKtc-Regular.otf"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf' \
            --output "$font"
          expected_blob='f9376bae1d421520f73a3c6c9d50b22f89548301'
          [[ "$(git hash-object "$font")" == "$expected_blob" ]] || {
            echo 'Unexpected CJK font checksum' >&2
            exit 1
          }
          fc-cache -f "$font_dir"
          fc-match 'sans:lang=zh-tw'

      - name: Read and validate plugin metadata
        id: metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(sed -n "s/^version = '\([^']*\)'/\1/p" build.gradle | head -n 1)"
          manifest_version="$(sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' src/main/resources/META-INF/plugin.xml | head -n 1)"
          minimum_build="$(sed -n 's/.*since-build="\([^"]*\)".*/\1/p' src/main/resources/META-INF/plugin.xml | head -n 1)"
          [[ -n "$version" && "$version" == "$manifest_version" && -n "$minimum_build" ]] || {
            echo 'Plugin version mismatch between build.gradle and plugin.xml, or missing minimum build' >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_name=mollm-intellij-${version}.zip" >> "$GITHUB_OUTPUT"
          echo "minimum_build=$minimum_build" >> "$GITHUB_OUTPUT"

      - name: Download IntelliJ IDEA 2025.2 SDK
        id: setup-ide
        shell: bash
        run: |
          set -Eeuo pipefail
          version='2025.2.6.3'
          url="https://download.jetbrains.com/idea/ideaIC-${version}.tar.gz"
          archive="$RUNNER_TEMP/ideaIC-${version}.tar.gz"
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$url" --output "$archive"
          curl --fail --location --retry 4 --silent --show-error "${url}.sha256" --output "${archive}.sha256"
          checksum="$(awk 'NR==1 {print $1}' "${archive}.sha256")"
          [[ "$checksum" =~ ^[0-9A-Fa-f]{64}$ ]] || { echo 'Invalid JetBrains SDK checksum' >&2; exit 1; }
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/idea-sdk"
          tar -xzf "$archive" -C "$RUNNER_TEMP/idea-sdk"
          sdk_build_file="$(find "$RUNNER_TEMP/idea-sdk" -maxdepth 3 -type f -name build.txt -print -quit)"
          [[ -n "$sdk_build_file" ]] || { echo 'IntelliJ SDK build.txt not found' >&2; exit 1; }
          ide_home="$(dirname "$sdk_build_file")"
          sdk_build="$(cat "$sdk_build_file")"
          expected_major="${{ steps.metadata.outputs.minimum_build }}"
          expected_major="${expected_major%%.*}"
          [[ "${sdk_build#*-}" == "${expected_major}."* ]] || {
            echo "IntelliJ SDK $sdk_build is incompatible with required major $expected_major" >&2
            exit 1
          }
          echo "idea-home=$ide_home" >> "$GITHUB_OUTPUT"
          echo "IntelliJ SDK: $sdk_build (home: $ide_home)"

      - name: Compile, test and package IntelliJ plugin
        run: ./gradlew --no-daemon clean check buildPlugin -PideaHome="${{ steps.setup-ide.outputs.idea-home }}"

      - name: Sign plugin ZIP using Actions Secrets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: bash .github/scripts/sign_plugin.sh 'build/distributions/${{ steps.metadata.outputs.zip_name }}'

      - name: Verify archive and generate SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          cd build/distributions
          archive='${{ steps.metadata.outputs.zip_name }}'
          test -s "$archive"
          unzip -tq "$archive" >/dev/null
          sha256sum "$archive" > "$archive.sha256"
          sha256sum --check "$archive.sha256"

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: mollm-intellij-${{ steps.metadata.outputs.version }}-${{ github.run_number }}
          path: |
            build/distributions/${{ steps.metadata.outputs.zip_name }}
            build/distributions/${{ steps.metadata.outputs.zip_name }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        env:
          PLUGIN_VERSION: ${{ steps.metadata.outputs.version }}
          ZIP_NAME: ${{ steps.metadata.outputs.zip_name }}
        run: |
          echo "## MoLLM IntelliJ v${PLUGIN_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "ZIP: \`${ZIP_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Install via IntelliJ Settings > Plugins > ⚙ > Install Plugin from Disk.' >> "$GITHUB_STEP_SUMMARY"
          if [[ '${{ github.ref }}' == 'refs/heads/master' ]]; then
            echo 'After publication: https://github.com/${{ github.repository }}/releases/latest' >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4

      - name: Download signed plugin
        uses: actions/download-artifact@v4
        with:
          name: mollm-intellij-${{ needs.build.outputs.version }}-${{ github.run_number }}
          path: dist

      - name: Publish newest Release and remove old Releases
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/scripts/publish_latest_release.sh dist
